services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aidr-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "1433:1433"
    volumes:
      - aidr_mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_strong_Password123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: aidr-redis
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: aidr-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/aidr-realm.json:/opt/keycloak/data/import/aidr-realm.json:ro

  api:
    build:
      context: ./aidr-be
      dockerfile: AIDR.Api/Dockerfile
    container_name: aidr-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AidrDb: "Server=sqlserver,1433;Database=AIDR;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      Keycloak__Authority: "http://keycloak:8080/realms/aidr"
      Keycloak__Audience: "aidr-api"
      Keycloak__RequireHttpsMetadata: "false"
      Keycloak__BaseUrl: "http://keycloak:8080"
      Keycloak__Realm: "aidr"
      Keycloak__FrontendClientId: "aidr-fe"
      Keycloak__GoogleIdpAlias: "google"
      Jwt__Issuer: "aidr-api"
      Jwt__Audience: "aidr-fe"
      Jwt__SigningKey: "AIDR-Dev-Signing-Key-Change-Me-32chars!"
      Auth__FrontendResetPasswordUrl: "http://localhost:5173/reset-password"
      Cors__Origins__0: "http://localhost:5173"
    ports:
      - "5080:8080"
    depends_on:
      - sqlserver
      - redis
      - keycloak

  nginx:
    image: nginx:1.27-alpine
    container_name: aidr-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - keycloak

volumes:
  aidr_mssql_data:
