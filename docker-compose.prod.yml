# AIDR production stack - all-in-one VPS
# 4 GB RAM: bắt buộc swap 4 GB + memory limit dưới đây (xem guide-deploy-vps-step-by-step.md)
# Usage on VPS:
#   cp infra/env/prod.env.example /opt/aidr/.env
#   docker compose -f docker-compose.prod.yml --env-file /opt/aidr/.env up -d

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aidr-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      # Giới hạn RAM SQL - quan trọng trên VPS 4 GB
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-1536}
    volumes:
      - aidr_mssql_data:/var/opt/mssql
    networks: [aidr]
    mem_limit: 1800m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: aidr-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - aidr_redis_data:/data
    networks: [aidr]
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kc-db:
    image: postgres:16-alpine
    container_name: aidr-kc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - aidr_kc_pg_data:/var/lib/postgresql/data
    networks: [aidr]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: aidr-keycloak
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kc-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: ${DOMAIN}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_URL: https://${DOMAIN}/auth
      KC_HOSTNAME_ADMIN_URL: https://${DOMAIN}/auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx512m"
    volumes:
      - ./infra/keycloak/aidr-realm.json:/opt/keycloak/data/import/aidr-realm.json:ro
    depends_on:
      kc-db:
        condition: service_healthy
    networks: [aidr]
    mem_limit: 768m

  api:
    image: ${API_IMAGE:-ghcr.io/OWNER/aidr-api:latest}
    container_name: aidr-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AidrDb: "Server=sqlserver,1433;Database=AIDR;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD},abortConnect=False"
      Caching__UseInMemory: "false"
      Keycloak__Authority: "https://${DOMAIN}/auth/realms/aidr"
      Keycloak__Audience: aidr-api
      Keycloak__RequireHttpsMetadata: "true"
      Keycloak__BaseUrl: "https://${DOMAIN}/auth"
      Keycloak__Realm: aidr
      Keycloak__FrontendClientId: aidr-fe
      Cors__Origins__0: "https://${DOMAIN}"
      Cors__Origins__1: "https://www.${DOMAIN}"
      Auth__FrontendResetPasswordUrl: "https://${DOMAIN}/reset-password"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [aidr]
    mem_limit: 512m

  nginx:
    image: nginx:1.27-alpine
    container_name: aidr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./fe-dist:/var/www/aidr-fe:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on: [api, keycloak]
    networks: [aidr]
    mem_limit: 64m

volumes:
  aidr_mssql_data:
  aidr_redis_data:
  aidr_kc_pg_data:

networks:
  aidr:
    driver: bridge
