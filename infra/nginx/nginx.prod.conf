worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream aidr_api {
        server api:8080;
    }

    upstream aidr_keycloak {
        server keycloak:8080;
    }

    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/aidr.id.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aidr.id.vn/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # FE OAuth callback — KHÔNG proxy sang Keycloak
        # (trùng prefix /auth/ với KC_HTTP_RELATIVE_PATH)
        location = /auth/callback {
            root /var/www/aidr-fe;
            try_files /index.html =404;
        }

        # Keycloak: ^~ để CSS/JS dưới /auth/resources không bị location regex FE nuốt
        location ^~ /auth/ {
            proxy_pass http://aidr_keycloak;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        location /api/ {
            proxy_pass http://aidr_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $request_id;
        }

        location /hubs/ {
            proxy_pass http://aidr_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_cache_bypass $http_upgrade;
        }

        # FE static (không dùng regex toàn cục .css — tránh cướp asset Keycloak)
        location / {
            root /var/www/aidr-fe;
            try_files $uri $uri/ /index.html;
        }

        location ^~ /assets/ {
            root /var/www/aidr-fe;
            expires 7d;
            add_header Cache-Control "public";
        }

        location ^~ /theme/ {
            root /var/www/aidr-fe;
            expires 7d;
            add_header Cache-Control "public";
        }

        location ^~ /admin-theme/ {
            root /var/www/aidr-fe;
            expires 7d;
            add_header Cache-Control "public";
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
